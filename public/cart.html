<script>
let ACTIVE_DISCOUNT = JSON.parse(localStorage.getItem('kapra_discount') || 'null');

async function render() {
  const cart = getCart();
  const root = document.getElementById('cart-root');
  const FREE_DELIVERY_THRESHOLD = 3000;

  if (cart.length === 0) {
    root.innerHTML = `<div class="empty-state">Your cart is empty. <a href="/index.html">Start shopping</a></div>`;
    localStorage.removeItem('kapra_discount');
    return;
  }

  const subtotal = cartTotal(cart);
  const discountAmount = ACTIVE_DISCOUNT ? ACTIVE_DISCOUNT.discount_amount : 0;
  const total = Math.max(0, subtotal - discountAmount);
  const remaining = FREE_DELIVERY_THRESHOLD - total;
  const pct = Math.min(100, Math.round((total / FREE_DELIVERY_THRESHOLD) * 100));
  const shippingBar = remaining > 0 ? `
    <div class="shipping-progress">
      <p>Add <b>${money(remaining)}</b> more for FREE delivery!</p>
      <div class="shipping-bar-track"><div class="shipping-bar-fill" style="width:${pct}%;"></div></div>
    </div>
  ` : `
    <div class="shipping-progress shipping-unlocked">
      <p>✓ You've unlocked FREE delivery!</p>
    </div>
  `;

  const discountBox = ACTIVE_DISCOUNT ? `
    <div class="discount-applied">
      <span>✓ "${ACTIVE_DISCOUNT.code}" applied — ${ACTIVE_DISCOUNT.title}</span>
      <button id="remove-discount-btn" type="button">Remove</button>
    </div>
  ` : `
    <div class="discount-code-box">
      <input type="text" id="discount-code-input" placeholder="Discount code">
      <button id="apply-discount-btn" type="button">Apply</button>
    </div>
    <div id="discount-msg" style="font-size:12px; margin-top:6px;"></div>
  `;

  root.innerHTML = shippingBar + cart.map((item, i) => `
    <div class="cart-row">
      <img src="${item.image_url}" alt="${item.name}">
      <div>
        <div class="product-name">${item.name}</div>
        <div style="font-size:13px; margin-top:4px;">${money(item.price)}</div>
      </div>
      <input class="qty-input" type="number" min="1" value="${item.qty}" data-index="${i}">
      <span class="remove-link" data-index="${i}">Remove</span>
    </div>
  `).join('') + discountBox + `
    <div class="cart-total-row" style="font-size:15px; padding:8px 0 0;">
      <span>Subtotal</span>
      <span>${money(subtotal)}</span>
    </div>
    ${discountAmount > 0 ? `
    <div class="cart-total-row" style="font-size:15px; padding:4px 0; color:#1B8A4C;">
      <span>Discount</span>
      <span>-${money(discountAmount)}</span>
    </div>` : ''}
    <div class="cart-total-row">
      <span>Total</span>
      <span>${money(total)}</span>
    </div>
    <a href="/checkout.html" class="btn" style="width:100%; text-align:center; box-sizing:border-box;">Proceed to Checkout</a>
  `;

  root.querySelectorAll('.qty-input').forEach(input => {
    input.addEventListener('change', (e) => {
      updateCartQty(Number(e.target.dataset.index), Number(e.target.value));
      ACTIVE_DISCOUNT = null;
      localStorage.removeItem('kapra_discount');
      render();
    });
  });
  root.querySelectorAll('.remove-link').forEach(link => {
    link.addEventListener('click', (e) => {
      removeFromCart(Number(e.target.dataset.index));
      ACTIVE_DISCOUNT = null;
      localStorage.removeItem('kapra_discount');
      render();
    });
  });

  document.getElementById('apply-discount-btn')?.addEventListener('click', async () => {
    const input = document.getElementById('discount-code-input');
    const msg = document.getElementById('discount-msg');
    if (!input.value.trim()) return;
    msg.textContent = 'Checking…';
    msg.style.color = 'var(--charcoal-soft)';
    try {
      const res = await fetch('/api/apply-discount', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: input.value.trim(), cart })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Invalid code');
      ACTIVE_DISCOUNT = { code: data.code, title: data.title, discount_amount: data.discount_amount };
      localStorage.setItem('kapra_discount', JSON.stringify(ACTIVE_DISCOUNT));
      render();
    } catch (err) {
      msg.textContent = err.message;
      msg.style.color = '#C0392B';
    }
  });

  document.getElementById('remove-discount-btn')?.addEventListener('click', () => {
    ACTIVE_DISCOUNT = null;
    localStorage.removeItem('kapra_discount');
    render();
  });
}
render();
</script>
