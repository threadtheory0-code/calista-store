<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Calista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner container">
    <a href="/" class="logo">Calista</a>
    <ul class="nav-links">
      <li><a href="/collection.html">Unstitched Lawn</a></li>
    </ul>
    <div class="header-icons">
      <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="/cart.html">Cart <span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>
<nav class="mobile-nav-drawer" id="mobile-nav-drawer">
  <div class="drawer-head">
    <span class="logo">Calista</span>
    <button class="drawer-close" id="mobile-nav-close" aria-label="Close menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <a href="/index.html">Home</a>
  <a href="/collection.html">Unstitched Lawn</a>
  <a href="/collection.html">Sale</a>
  <a href="/cart.html">Cart</a>
</nav>

<div id="product-root" class="product-detail">
  <!-- filled by script -->
</div>

<footer class="site-footer">
  <div class="footer-bottom">&copy; 2026 Calista. Built on Cloudflare Pages.</div>
</footer>

<div class="sticky-atc" id="sticky-atc" style="display:none;">
  <span class="sticky-price" id="sticky-price"></span>
  <button class="btn" id="sticky-add-btn">Add to Cart</button>
</div>

<script src="/app.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const product = await getProduct(slug);
  const root = document.getElementById('product-root');

  if (!product) {
    root.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Product not found. <a href="/index.html">Back to shop</a></div>`;
    return;
  }

  let galleryImages = [];
  try {
    if (product.images_json) galleryImages = JSON.parse(product.images_json);
  } catch (e) {}
  if (!galleryImages.length) {
    galleryImages = [product.image_url, product.image_url_2].filter(Boolean);
  }

  root.innerHTML = `
    <div class="product-gallery-slider">
      <div class="gallery-track" id="gallery-track">
        ${galleryImages.map(img => `<div class="gallery-slide"><img src="${img}" alt="${product.name}"></div>`).join('')}
      </div>
      <button class="gallery-arrow gallery-arrow-left" id="gallery-prev" aria-label="Previous image">‹</button>
      <button class="gallery-arrow gallery-arrow-right" id="gallery-next" aria-label="Next image">›</button>
      <div class="gallery-dots" id="gallery-dots"></div>
    </div>
    <div class="product-copy">
      <span class="fabric-tag">${product.fabric || ''}</span>
      <h1>${product.name}</h1>
      <div class="price-row">${priceHtml(product)}</div>
      <p class="desc">${product.description || ''}</p>
      <button class="btn" id="add-btn" style="width:100%;">Add to Cart</button>
    </div>
  `;

  initGallery(galleryImages);

  function addCurrentToCart() {
    addToCart(product, 1);
    showToast(`Added — ${product.name}`);
    fireConfetti();
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    addCurrentToCart();
    document.getElementById('add-btn').textContent = 'Added ✓';
    setTimeout(() => { document.getElementById('add-btn').textContent = 'Add to Cart'; }, 1200);
  });

  const stickyBar = document.getElementById('sticky-atc');
  const stickyPrice = document.getElementById('sticky-price');
  const stickyBtn = document.getElementById('sticky-add-btn');
  stickyPrice.innerHTML = priceHtml(product);
  stickyBar.style.display = '';
  stickyBtn.addEventListener('click', () => {
    addCurrentToCart();
    stickyBtn.textContent = 'Added ✓';
    setTimeout(() => { stickyBtn.textContent = 'Add to Cart'; }, 1200);
  });

  function initGallery(images) {
    const track = document.getElementById('gallery-track');
    const dotsBox = document.getElementById('gallery-dots');
    const prevBtn = document.getElementById('gallery-prev');
    const nextBtn = document.getElementById('gallery-next');

    dotsBox.innerHTML = images.map((_, i) => `<button class="gallery-dot ${i === 0 ? 'active' : ''}" data-i="${i}" aria-label="Go to image ${i + 1}"></button>`).join('');

    function currentIndex() {
      return Math.round(track.scrollLeft / track.clientWidth);
    }
    function scrollToSlide(i) {
      track.scrollTo({ left: track.clientWidth * i, behavior: 'smooth' });
    }
    prevBtn.addEventListener('click', () => scrollToSlide(Math.max(0, currentIndex() - 1)));
    nextBtn.addEventListener('click', () => scrollToSlide(Math.min(images.length - 1, currentIndex() + 1)));
    dotsBox.querySelectorAll('.gallery-dot').forEach(dot => {
      dot.addEventListener('click', () => scrollToSlide(Number(dot.dataset.i)));
    });
    track.addEventListener('scroll', () => {
      const i = currentIndex();
      dotsBox.querySelectorAll('.gallery-dot').forEach((d, idx) => d.classList.toggle('active', idx === i));
    }, { passive: true });

    if (images.length <= 1) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsBox.style.display = 'none';
    }
  }
})();
</script>
</body>
</html>
