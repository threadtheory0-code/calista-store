<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const product = await getProduct(slug);
  const root = document.getElementById('product-root');

  if (!product) {
    root.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Product not found. <a href="/index.html">Back to shop</a></div>`;
    return;
  }

  let galleryImages = [];
  try {
    if (product.images_json) galleryImages = JSON.parse(product.images_json);
  } catch (e) {}
  if (!galleryImages.length) {
    galleryImages = [product.image_url, product.image_url_2].filter(Boolean);
  }

  const stockNote = product.stock > 0 && product.stock <= 5
    ? `<p class="low-stock">Only ${product.stock} left in stock</p>` : '';

  root.innerHTML = `
    <div class="product-gallery-slider">
      <div class="gallery-track" id="gallery-track">
        ${galleryImages.map(img => `<div class="gallery-slide"><img src="${img}" alt="${product.name}"></div>`).join('')}
      </div>
      <button class="gallery-arrow gallery-arrow-left" id="gallery-prev" aria-label="Previous image">‹</button>
      <button class="gallery-arrow gallery-arrow-right" id="gallery-next" aria-label="Next image">›</button>
      <div class="gallery-dots" id="gallery-dots"></div>
    </div>
    <div class="product-copy">
      <span class="fabric-tag">${product.fabric || ''}</span>
      <h1>${product.name}</h1>
      <div class="price-row">${priceHtml(product)}</div>
      ${stockNote}
      <div class="desc">${cleanDescription(product.description)}</div>
      <button class="btn cart-btn" id="add-btn" style="width:100%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-btn-text">Add to Cart</span>
      </button>
      <div class="whatsapp-actions">
        <a class="whatsapp-inquire-btn" id="whatsapp-inquire" href="#" target="_blank" rel="noopener">
          <span class="whatsapp-icon-circle">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 3C9.373 3 4 8.373 4 15c0 2.34.66 4.52 1.8 6.38L4 29l7.82-1.75A11.93 11.93 0 0 0 16 27c6.627 0 12-5.373 12-12S22.627 3 16 3Zm0 21.6c-1.9 0-3.68-.55-5.18-1.5l-.37-.22-4.28.96.93-4.17-.24-.38A9.57 9.57 0 0 1 5.4 15c0-5.85 4.75-10.6 10.6-10.6S26.6 9.15 26.6 15 21.85 24.6 16 24.6Zm5.62-7.9c-.3-.15-1.8-.89-2.08-.99-.28-.1-.48-.15-.68.15-.2.3-.78.99-.96 1.19-.18.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.79-1.68-2.09-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.68-1.64-.93-2.24-.24-.58-.49-.5-.68-.51h-.58c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.8-.73 2.05-1.44.25-.71.25-1.32.18-1.44-.07-.12-.27-.2-.57-.35Z"/></svg>
          </span>
          <span class="whatsapp-btn-copy">
            <span class="whatsapp-btn-title">Ask About This Item</span>
            <span class="whatsapp-btn-sub">Get a reply on WhatsApp in minutes</span>
          </span>
        </a>
        <a class="whatsapp-group-btn" href="https://chat.whatsapp.com/BLG8L8PmXDjFJQBqjMmBM6?s=cl&p=a&ilr=4" target="_blank" rel="noopener">
          <span class="whatsapp-icon-circle">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 3C9.373 3 4 8.373 4 15c0 2.34.66 4.52 1.8 6.38L4 29l7.82-1.75A11.93 11.93 0 0 0 16 27c6.627 0 12-5.373 12-12S22.627 3 16 3Zm0 21.6c-1.9 0-3.68-.55-5.18-1.5l-.37-.22-4.28.96.93-4.17-.24-.38A9.57 9.57 0 0 1 5.4 15c0-5.85 4.75-10.6 10.6-10.6S26.6 9.15 26.6 15 21.85 24.6 16 24.6Zm5.62-7.9c-.3-.15-1.8-.89-2.08-.99-.28-.1-.48-.15-.68.15-.2.3-.78.99-.96 1.19-.18.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.79-1.68-2.09-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.68-1.64-.93-2.24-.24-.58-.49-.5-.68-.51h-.58c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.8-.73 2.05-1.44.25-.71.25-1.32.18-1.44-.07-.12-.27-.2-.57-.35Z"/></svg>
          </span>
          <span class="whatsapp-btn-copy">
            <span class="whatsapp-btn-title">Join Calista Insiders</span>
            <span class="whatsapp-btn-sub">New arrivals &amp; sale alerts</span>
          </span>
        </a>
      </div>
    </div>
  `;

  // SEO: dynamic title, meta description, Open Graph, and Product structured data
  document.getElementById('page-title').textContent = `${product.name} — Calista`;
  document.getElementById('meta-description').setAttribute('content', (product.description || '').slice(0, 155));
  document.getElementById('og-title').setAttribute('content', product.name);
  document.getElementById('og-description').setAttribute('content', (product.description || '').slice(0, 155));
  document.getElementById('og-image').setAttribute('content', galleryImages[0] || '');
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'Product',
    name: product.name,
    description: product.description || '',
    image: galleryImages,
    offers: {
      '@type': 'Offer',
      priceCurrency: 'PKR',
      price: product.sale_price || product.price,
      availability: product.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock'
    }
  });
  document.head.appendChild(ldScript);

  ttEvent('ViewContent', {
    contents: [{ content_id: String(product.id), content_type: 'product', content_name: product.name }],
    value: product.sale_price || product.price,
    currency: 'PKR'
  });

  loadRelatedProducts(product);

  initGallery(galleryImages);

  function addCurrentToCart() {
    addToCart(product, 1);
    showToast(`Added — ${product.name}`);
    fireConfetti();
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    addCurrentToCart();
    document.getElementById('add-btn').textContent = 'Added ✓';
    setTimeout(() => { document.getElementById('add-btn').textContent = 'Add to Cart'; }, 1200);
  });

  const stickyBar = document.getElementById('sticky-atc');
  const stickyPrice = document.getElementById('sticky-price');
  const stickyBtn = document.getElementById('sticky-add-btn');
  stickyPrice.innerHTML = priceHtml(product);
  stickyBar.style.display = '';
  const effectivePrice = product.sale_price || product.price;
  const waMessage = `Hi, I'm interested in ${product.name} (${money(effectivePrice)}). Can you share more details? ${window.location.href}`;
  document.getElementById('whatsapp-inquire').href = `https://wa.me/923026255682?text=${encodeURIComponent(waMessage)}`;

  stickyBtn.addEventListener('click', () => {
    addCurrentToCart();
    stickyBtn.textContent = 'Added ✓';
    setTimeout(() => { stickyBtn.textContent = 'Add to Cart'; }, 1200);
  });

  function initGallery(images) {
    const track = document.getElementById('gallery-track');
    const dotsBox = document.getElementById('gallery-dots');
    const prevBtn = document.getElementById('gallery-prev');
    const nextBtn = document.getElementById('gallery-next');

    dotsBox.innerHTML = images.map((_, i) => `<button class="gallery-dot ${i === 0 ? 'active' : ''}" data-i="${i}" aria-label="Go to image ${i + 1}"></button>`).join('');

    function currentIndex() {
      return Math.round(track.scrollLeft / track.clientWidth);
    }
    function scrollToSlide(i) {
      track.scrollTo({ left: track.clientWidth * i, behavior: 'smooth' });
    }
    prevBtn.addEventListener('click', () => scrollToSlide(Math.max(0, currentIndex() - 1)));
    nextBtn.addEventListener('click', () => scrollToSlide(Math.min(images.length - 1, currentIndex() + 1)));
    dotsBox.querySelectorAll('.gallery-dot').forEach(dot => {
      dot.addEventListener('click', () => scrollToSlide(Number(dot.dataset.i)));
    });
    track.addEventListener('scroll', () => {
      const i = currentIndex();
      dotsBox.querySelectorAll('.gallery-dot').forEach((d, idx) => d.classList.toggle('active', idx === i));
    }, { passive: true });

    if (images.length <= 1) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsBox.style.display = 'none';
    }
  }
  async function loadRelatedProducts(currentProduct) {
    const root = document.getElementById('related-root');
    const all = await getProducts();
    const related = all
      .filter(p => p.id !== currentProduct.id && p.fabric === currentProduct.fabric)
      .slice(0, 4);
    if (related.length === 0) return;
    root.innerHTML = `
      <div class="section-head" style="margin-bottom:24px;">
        <h2 style="font-size:26px;">You May Also Like</h2>
        <div class="stitch-divider" style="width:60px; margin:14px auto 0;"></div>
      </div>
      <div class="product-grid">
        ${related.map(p => `
          <a class="product-card" href="/product.html?slug=${p.slug}">
            <div class="product-thumb">
              <img src="${p.image_url}" alt="${p.name}" loading="lazy">
              ${p.sale_price ? `<span class="badge-sale">SALE</span>` : ''}
            </div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${priceHtml(p)}</div>
            </div>
          </a>
        `).join('')}
      </div>
    `;
  }
})();
</script>

  </svg>
</a>
