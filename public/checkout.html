<script>
function renderSummary() {
  const cart = getCart();
  const discount = JSON.parse(localStorage.getItem('kapra_discount') || 'null');
  const subtotal = cartTotal(cart);
  const discountAmount = discount ? discount.discount_amount : 0;
  const total = Math.max(0, subtotal - discountAmount);
  return `
    <div class="order-summary">
      ${cart.map(i => `<div class="row"><span>${i.name} x${i.qty}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}
      ${discount ? `<div class="row" style="color:#1B8A4C;"><span>Discount (${discount.code})</span><span>-${money(discountAmount)}</span></div>` : ''}
      <div class="row" style="font-weight:600; border-top:1px solid var(--line); margin-top:8px; padding-top:10px;">
        <span>Total (Cash on Delivery)</span><span>${money(total)}</span>
      </div>
    </div>
  `;
}

function render() {
  const cart = getCart();
  const root = document.getElementById('checkout-root');

  if (cart.length === 0) {
    root.innerHTML = `<div class="empty-state">Your cart is empty. <a href="/index.html">Start shopping</a></div>`;
    return;
  }

  root.innerHTML = renderSummary() + `
    <div id="cod-note-mount"></div>
    <form class="checkout-form" id="checkout-form">
      <div>
        <label>Full Name</label>
        <input type="text" name="customer_name" required>
      </div>
      <div>
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="0300 1234567" inputmode="numeric" autocomplete="tel" required>
        <div class="field-error" id="phone-error" style="display:none;">Enter an 11-digit mobile number starting 03 — the courier calls before delivery.</div>
      </div>
      <div>
        <label>Delivery Address</label>
        <textarea name="address" rows="3" placeholder="House / street, area, nearest landmark" required></textarea>
        <div class="field-error" id="address-error" style="display:none;">Please add a bit more detail so the courier can find you.</div>
      </div>
      <div>
        <label>City</label>
        <input type="text" name="city" required>
      </div>
      <button type="submit" class="btn" id="submit-btn">Place Order — Cash on Delivery</button>
      <div id="checkout-msg" style="font-size:13px; margin-top:8px;"></div>
    </form>
  `;

  ttEvent('InitiateCheckout', {
    contents: cart.map(i => ({ content_id: String(i.product_id), content_type: 'product', content_name: i.name, price: i.price, quantity: i.qty })),
    value: cartTotal(cart),
    currency: 'PKR'
  });

  // Says plainly what happens after the order is placed — the single
  // biggest cash-on-delivery worry. Copy comes from Admin → Settings.
  convSettings().then(s => {
    const mount = document.getElementById('cod-note-mount');
    if (mount) {
      mount.innerHTML = '<p class="cod-note">' + escapeHtml(s.codNote) +
        (s.exchangeNote ? ' ' + escapeHtml(s.exchangeNote) : '') + '</p>';
    }
  });

  // Same rule the Worker enforces, run early so a typo is caught here.
  function cleanPhone(v) {
    let d = String(v || '').replace(/[^0-9]/g, '');
    if (d.indexOf('0092') === 0) d = d.slice(4);
    else if (d.indexOf('92') === 0) d = d.slice(2);
    if (d.indexOf('3') === 0) d = '0' + d;
    return /^03[0-9]{9}$/.test(d) ? d : null;
  }

  document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('checkout-msg');

    const phoneError = document.getElementById('phone-error');
    const addressError = document.getElementById('address-error');
    const phone = cleanPhone(form.phone.value);
    const address = form.address.value.trim();
    phoneError.style.display = phone ? 'none' : '';
    addressError.style.display = address.length >= 10 ? 'none' : '';
    if (!phone || address.length < 10) {
      (phone ? form.address : form.phone).focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Placing order...';

    const discount = JSON.parse(localStorage.getItem('kapra_discount') || 'null');
    const payload = {
      customer_name: form.customer_name.value,
      phone: phone,
      address: address,
      city: form.city.value,
      items: cart,
      discount_code: discount ? discount.code : null
    };

    try {
      const res = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        let serverMsg = '';
        try { serverMsg = (await res.json()).error || ''; } catch (e) {}
        throw new Error(serverMsg || 'Order failed');
      }
      const orderResult = await res.json();
      ttEvent('CompletePayment', {
        contents: cart.map(i => ({ content_id: String(i.product_id), content_type: 'product', content_name: i.name, price: i.price, quantity: i.qty })),
        value: orderResult.total,
        currency: 'PKR'
      });
      localStorage.removeItem('kapra_cart');
      localStorage.removeItem('kapra_discount');
      root.innerHTML = `<div class="empty-state">
        <h2 class="display" style="margin-bottom:10px;">Order Placed ✓</h2>
        <p>Thank you! We'll call you shortly to confirm your order.</p>
        <a href="/index.html" class="btn" style="margin-top:20px;">Continue Shopping</a>
      </div>`;
      updateCartBadge();
    } catch (err) {
      msg.textContent = err.message && err.message !== 'Order failed'
        ? err.message
        : 'Something went wrong — please try again, or message us on WhatsApp and we will place the order for you.';
      msg.style.color = 'var(--maghi-red)';
      btn.disabled = false;
      btn.textContent = 'Place Order — Cash on Delivery';
    }
  });
}
render();
</script>
